name: Build ARCVM Super-Kernel
on: [workflow_dispatch] # Manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # --- NEW: CRITICAL CLEANUP STEP ---
      - name: Force Cleanup Previous Run
        run: |
          sudo swapoff -a || true
          sudo umount -l /home/runner/work/ARCVM-Super-Kernel/ARCVM-Super-Kernel || true
          sudo lvremove -f buildvg || true
          sudo vgremove -f buildvg || true
          sudo pvremove -f /dev/loop0 /dev/loop1 || true
          sudo losetup -D || true
          sudo rm -f /pv.img /mnt/tmp-pv.img
      # 1. Clear disk space (CRITICAL: Public runners only have ~14GB usable otherwise)
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 16384
          temp-reserve-mb: 100
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'

      - name: Install Dependencies
        run: |
          sudo apt update && sudo apt install -y bc bison build-essential curl flex git git-lfs gnupg gperf libssl-dev libncurses5-dev
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      # 2. Sync Kernel Source (Shallow & Optimized)
      - name: Sync Source (GKI 5.10)
        run: |
          # We use the main A13-5.10 branch which contains the virtual-device configs
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.10 --depth=1
          repo sync -c -j$(nproc) --no-tags --no-clone-bundle

      # 3. Integrate KernelSU Next
      - name: Setup KernelSU Next
        run: |
          cd common
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s main
          cd ..

      # 4. Apply SusFS Patches (5.10 GKI Branch)
      # - name: Apply SusFS
      #   run: |
      #     git clone -b gki-android13-5.10 https://gitlab.com/simonpunk/susfs4ksu.git
      #     # Bridge KSU Next to SusFS
      #     cd common/KernelSU-Next
      #     patch -p1 < ../../susfs4ksu/kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch
      #     cd ../..
      #     # Patch Kernel Core
      #     cd common
      #     cp ../susfs4ksu/kernel_patches/fs/susfs.c fs/
      #     cp ../susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/
      #     patch -p1 < ../susfs4ksu/kernel_patches/50_add_susfs_in_kernel-5.10.patch
      #     patch -p1 < ../susfs4ksu/kernel_patches/fs/0001-fs-add-susfs-support.patch
      #     cd ..

      # 5. Inject Super-Features into Fragment
      # - name: Configure Features
      #   run: |
      #     FRAG="common-modules/virtual-device/virtual_device.fragment"
      #     echo "# Network Features" >> $FRAG
      #     echo "CONFIG_WIREGUARD=y" >> $FRAG
      #     echo "CONFIG_TCP_CONG_BBR=y" >> $FRAG
      #     echo "CONFIG_DEFAULT_BBR=y" >> $FRAG
      #     echo "CONFIG_NETFILTER_XT_SET=y" >> $FRAG
      #     echo "CONFIG_IP_SET=y" >> $FRAG
      #     echo "CONFIG_NETFILTER_XT_TARGET_TPROXY=y" >> $FRAG
      #     echo "# Memory & Performance" >> $FRAG
      #     echo "CONFIG_LRU_GEN=y" >> $FRAG
      #     echo "CONFIG_LRU_GEN_ENABLED=y" >> $FRAG
      #     echo "# Stealth & Overlays" >> $FRAG
      #     echo "CONFIG_OVERLAY_FS=y" >> $FRAG
      #     echo "CONFIG_KSU_SUSFS=y" >> $FRAG
      #     echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUS_PATH=y" >> $FRAG
      #     echo "CONFIG_KSU_SUSFS_HIDE_KSU_SUS_MOUNT=y" >> $FRAG
      #     echo "CONFIG_KSU_SUSFS_SPOOF_UNAME=y" >> $FRAG
      #     # Required for KSU Next
      #     echo "CONFIG_KPROBES=y" >> $FRAG
      #     echo "CONFIG_KPROBE_EVENTS=y" >> $FRAG
      - name: Configure Features
        run: |
          FRAG="common-modules/virtual-device/virtual_device.fragment"
          {
            echo "# Network Features"
            echo "CONFIG_WIREGUARD=y"
            echo "CONFIG_TCP_CONG_BBR=y"
            echo "CONFIG_DEFAULT_BBR=y"
            echo "CONFIG_NETFILTER_XT_SET=y"
            echo "CONFIG_IP_SET=y"
            echo "CONFIG_NETFILTER_XT_TARGET_TPROXY=y"
            echo "# Memory & Performance"
            echo "CONFIG_LRU_GEN=y"
            echo "CONFIG_LRU_GEN_ENABLED=y"
            echo "# Overlays & Root"
            echo "CONFIG_OVERLAY_FS=y"
            echo "CONFIG_KSU=y"
            echo "CONFIG_KPROBES=y"
            echo "CONFIG_KPROBE_EVENTS=y"
            echo "CONFIG_LOCALVERSION=-1008312-g500d05631d89"
          } >> $FRAG

      # 6. Execute Build
      - name: Build Kernel
        run: |
          # Use LTO Thin for speed; output as x86_64 bzImage for ARCVM
          LTO=thin BUILD_CONFIG=common-modules/virtual-device/build.config.virtual_device.x86_64 build/build.sh

      # 7. Upload Result
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arcvm-ksu-next-bzImage
          path: out/android13-5.10/dist/bzImage